# 打 v* tag 或手动触发时构建镜像，供「无需 clone 构建」的一键安装使用。
# 日常 push main 不再构建，以降低 Actions 机时与 GHCR 存储。
# 打 v* tag 时：镜像推送成功后自动调用 Deploy Cloud VPS（需配置 DEPLOY_* secrets）。
# 使用前将 docker-compose 中的 image 设为 ghcr.io/<owner>/regulus-academy:latest

name: Docker Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 等镜像进 GHCR 后再部署，避免 tag 触发时 deploy 与 publish 抢跑
  deploy-demo:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-cloud-vps.yml
    with:
      image_tag: ${{ github.ref_name }}
    secrets: inherit
