# 手动触发：SSH 到自建主机 pull + 重启（日常云部署请本机操作，避免每次 push 占 runner）
# Secrets（均勿写入仓库）：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY
# 可选：DEPLOY_PATH（默认 /opt/regulus-academy）、DEPLOY_IMAGE（默认 ghcr.io/<本仓库>）
# 未配置 DEPLOY_HOST 时 job 会成功跳过（不在 if 里读 secrets，GitHub 不允许）

name: Deploy Cloud VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default latest, or a version like v1.2.3)"
        required: false
        default: "latest"

concurrency:
  group: deploy-cloud-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # secrets 不能用于 if；先映射到 env 再判断
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_IMAGE: ${{ secrets.DEPLOY_IMAGE }}
    steps:
      - name: Skip if deploy secrets missing
        id: gate
        run: |
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_* secrets not set; skip deploy (OK for forks / local-only)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tag
        if: steps.gate.outputs.configured == 'true'
        id: tag
        run: |
          set -euo pipefail
          IMAGE="${DEPLOY_IMAGE:-ghcr.io/${{ github.repository }}}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.event.inputs.image_tag }}"
          TAG="${TAG:-latest}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}:${TAG}"

      - name: Deploy over SSH
        if: steps.gate.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/regulus-academy}"
            export REGULUS_IMAGE="${{ steps.tag.outputs.image }}"
            cd "$DEPLOY_PATH"
            docker compose pull
            docker compose up -d
            docker compose ps
            HOST_PORT="$(grep -E '^HOST_PORT=' .env 2>/dev/null | cut -d= -f2- | tr -d ' \r' || true)"
            HOST_PORT="${HOST_PORT:-8080}"
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${HOST_PORT}/health" >/dev/null; then
                echo "health ok after ${i} attempt(s)"
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "health check failed"
              docker compose logs --tail=80
              exit 1
            fi
