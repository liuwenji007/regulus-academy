node: 提示词的定义与核心作用
key: prompt_definition
layer: 入门
core_concepts:
    - 提示词的定义
    - 提示词与大语言模型的交互逻辑
    - 提示词对输出质量的影响
common_mistakes:
    - 认为提示词只是简单提问，忽略结构化设计
    - 混淆提示词和模型参数配置的作用
boundaries:
    - 不讲具体提示词编写技巧
    - 不讲模型底层原理
exercise_ideas:
    - 判断给定文本是否属于有效提示词
    - 分析不同提示词对模型输出的影响差异
grading_hints:
    - 能准确说出提示词的核心作用
    - 能区分提示词和模型其他配置的差异
first_exercise_level: recognition
domain_kind: applied
teaching_beats:
    - concept: 提示词的定义
      must_teach:
        - 提示词是引导大模型生成内容的输入文本
        - 不等同于普通聊天里的随意提问
      context_type: workplace
    - concept: 提示词与大语言模型的交互逻辑
      must_teach:
        - 模型根据提示词中的指令与上下文组织输出
        - 结构化提示比模糊提问更可控
      context_type: workplace
    - concept: 提示词对输出质量的影响
      must_teach:
        - 清晰度、约束与示例会显著影响结果
        - 输出问题往往先查提示词而非先怪模型
      context_type: workplace
