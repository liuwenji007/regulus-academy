domain: Python 快速入门
slug: python-quickstart
parent_slug: ""
version: 1
description: 面向有 JS/Go 基础的开发者，快速掌握 Python 到能读写 Agent 工具链的代码

modules:
  - key: foundation
    label: Python 速通
    goal: 理解 Python 核心语法与 JS/Go 的映射关系
    order: 1
    nodes:
      - python_what_why
      - syntax_map
      - data_types
      - control_flow
  - key: intermediate
    label: 工程能力
    goal: 掌握函数、模块、文件操作和 CLI 开发
    order: 2
    nodes:
      - functions
      - modules_packages
      - file_io
      - argparse_cli
  - key: advanced
    label: Agent 工具链实战
    goal: 掌握异步编程、OpenAI SDK 和 agent-opt 代码架构
    order: 3
    nodes:
      - async_await
      - openai_sdk
      - type_hints
      - agentopt_walkthrough

layers:
  entry:
    label: 入门
    time: "约 2 小时"
    goal: 快速掌握 Python 核心语法，能读懂简单 Python 代码
    nodes:
      - key: python_what_why
        title: Python 是什么
      - key: syntax_map
        title: 语法对照：JS/Go → Python
      - key: data_types
        title: 数据类型与内置结构
      - key: control_flow
        title: 条件与循环
  intermediate:
    label: 熟悉
    time: "约 4 小时"
    goal: 能独立编写 Python 脚本，理解模块系统和 CLI 入口
    nodes:
      - key: functions
        title: 函数与作用域
      - key: modules_packages
        title: 模块、包与导入机制
      - key: file_io
        title: 文件读写与路径处理
      - key: argparse_cli
        title: 用 argparse 写 CLI 工具
  advanced:
    label: 精通
    time: "约 6 小时"
    goal: 能理解和修改 agent-opt 的异步、SDK 调用和整体架构
    nodes:
      - key: async_await
        title: Python 异步编程入门
      - key: openai_sdk
        title: OpenAI SDK 与 LLM 调用
      - key: type_hints
        title: 类型注解与静态检查
      - key: agentopt_walkthrough
        title: agent-opt 代码走读
