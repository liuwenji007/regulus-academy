node: Python 是什么
key: python_what_why
layer: 入门

core_concepts:
  - Python 是动态类型、解释型语言，语法极简
  - 与 JS/Go 的核心区别：缩进定义作用域、无关键字声明变量
  - 在 Agent 领域：Python 是 LLM 工具链的事实标准（OpenAI SDK、LangChain、fastapi）
  - agent-opt 就是用 Python 写的

common_mistakes:
  - 认为 Python 和 JS 一样松散 —— 但实际上 Python 有严格的缩进规则
  - 以为 Python 是"胶水语言"不适合工程 —— 实际上 OpenAI/vLLM/Transformers 都是 Python
  - 混淆动态类型和弱类型 —— Python 是强类型动态语言

boundaries:
  - 不讲安装和环境配置（环境管理在 syntax_map 覆盖）
  - 不讲语法细节（后续节点逐项覆盖）
  - 不讲版本差异（2 vs 3）

exercise_ideas:
  - "Python 在 Agent/LLM 生态中扮演什么角色？列举三个 Python 写的 Agent 工具"
  - "Python 的强类型动态 vs JavaScript 的弱类型动态，有什么实际区别？"

grading_hints:
  - Python 是动态语言但强类型（不会隐式类型转换）
  - 缩进是语法的一部分，不是风格选择
  - 几乎所有的 LLM 工具链（OpenAI SDK、LangChain、DSPy、vLLM）都是 Python

first_exercise_level: recognition
domain_kind: theoretical
teaching_beats:
  - concept: Python 在 Agent/LLM 生态中的统治地位
    must_teach:
      - OpenAI SDK、LangChain、DSPy、vLLM、HuggingFace 全部是 Python
      - agent-opt 也是 Python 项目
      - 想深入 Agent 方向，Python 是绕不开的
    context_type: workplace
  - concept: Python 与 JS/Go 的核心差异
    must_teach:
      - 缩进作用域 vs 花括号
      - 无 var/let/const，无类型声明
      - 动态类型但强类型
    context_type: workplace
