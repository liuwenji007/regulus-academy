node: 数据类型与内置结构
key: data_types
layer: 入门

core_concepts:
  - 基础类型：int（无大小限制）、float、str、bool、NoneType
  - "列表 list = [1, 2, 3]（类似 JS 数组，可以混类型）"
  - "元组 tuple = (1, 'a')（不可变，类似 Go 的结构体返回值）"
  - "字典 dict = {'key': 'value'}（类似 JS 对象/Map）"
  - "集合 set = {1, 2, 3}（去重、成员判断）"
  - type() 和 len() —— 最常用的两个内置函数

common_mistakes:
  - 把 list 当 JS 数组用但忘记 list 是引用类型
  - 尝试用对象属性语法 dict.key 而不是 dict['key']
  - 混淆 tuple 和 list（tuple 不可变）
  - 在遍历 dict 时修改 dict（RuntimeError）

boundaries:
  - 不讲面向对象（类在后续）
  - 不讲 typing 模块（单独节点）
  - 不讲生成器/迭代器（进阶节点）

exercise_ideas:
  - "list = [1, 2, 3] 和 tuple = (1, 2, 3) 有什么区别？哪个像 Go 的固定长度数组？"
  - 创建一个 dict，用三种方式遍历它的 key 和 value
  - "以下代码输出什么？print(type([]) == type({}))"

grading_hints:
  - list 是可变的有序集合，tuple 是不可变的有序集合
  - dict 用 [] 访问，get() 有默认值
  - set 自动去重，成员判断速度快
  - Python 所有类型都是对象，type() 返回类型

first_exercise_level: recognition
domain_kind: applied
teaching_beats:
  - concept: 列表（list）—— JS 数组的 Python 版
    must_teach:
      - 创建和索引
      - append()、extend()、切片 list[1:3]
      - "列表推导式 [x*2 for x in range(10)]"
    context_type: workplace
  - concept: 字典（dict）—— 最常用的数据结构
    must_teach:
      - "创建和访问 d['key'] / d.get('key', default)"
      - keys()、values()、items()
      - 字典推导式
    context_type: workplace
  - concept: 元组（tuple）—— 不可变序列
    must_teach:
      - 类似 Go 多返回值打包
      - 解包赋值 a, b = (1, 2)
      - 用作 dict 的 key（因为不可变）
    context_type: workplace
